<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Tunnel</title>
<meta name="description" content="A test track for robot policies with no robot. Nemotron reads the failures and proposes the fix; the simulator decides what stays.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10.5a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 17h7"/></svg></div>
      Wind Tunnel
    </div>
    <nav class="island" id="tabs">
      <a data-tab="overview" class="on">Overview</a><a data-tab="track">Track</a>
      <button class="run" id="run-dot" aria-label="Run the next round"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
      <a data-tab="failures">Failures</a><a data-tab="policy">Policy</a>
    </nav>
    <div class="right">
      <div class="chip nv"><i></i>Nemotron on Nebius</div>
      <div class="chip">Spend <b class="mono" id="spend">$0.000</b> <span class="mono">/ $0.15</span><div class="meter"><i id="spend-bar"></i></div></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
