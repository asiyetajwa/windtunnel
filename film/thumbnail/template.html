<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Plus Jakarta Sans'; src: url(../public/fonts/plus-jakarta-sans-variable.woff2) format('woff2'); font-weight: 200 800; }
@font-face { font-family: 'Geist Mono'; src: url(../public/fonts/geist-mono-variable.woff2) format('woff2'); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
body { width: var(--w); height: var(--h); overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(60% 55% at 0% 0%, #fde9dc 0%, transparent 70%), radial-gradient(60% 70% at 100% 100%, #f1c9b0 0%, transparent 70%), #f6dccb;
  display: grid; grid-template-columns: 1fr 1.08fr; grid-template-rows: minmax(0, 1fr); gap: 3%; padding: 4.2%; }
.hero { border-radius: 40px; padding: 7% 8%; color: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(70% 60% at 100% 0%, rgba(132,87,255,.9), transparent 65%), radial-gradient(60% 50% at 0% 100%, rgba(255,122,46,.3), transparent 70%), linear-gradient(170deg, #4a1fc4, #2c1077 75%);
  box-shadow: 0 40px 80px -40px rgba(58,26,150,.6); }
.brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: calc(var(--h) * 0.05); letter-spacing: -1px; }
.brand svg { width: calc(var(--h) * 0.08); height: calc(var(--h) * 0.08); }
h1 { font-size: calc(var(--h) * 0.088); line-height: 1.02; font-weight: 800; letter-spacing: -3px; }
h1 em { font-style: normal; color: #ffae6e; display: block; }
.stat { display: flex; align-items: baseline; gap: 14px; font-weight: 800; font-size: calc(var(--h) * 0.068); letter-spacing: -2px; }
.stat span { color: #c9b8ff; font-size: .55em; font-weight: 600; letter-spacing: 0; }
.sub { font-size: calc(var(--h) * 0.026); opacity: .75; margin-top: 6px; font-weight: 500; }
.right { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 4%; min-height: 0; }
.panel { position: relative; border-radius: 34px; overflow: hidden; background: #22105c; box-shadow: 0 30px 60px -30px rgba(120,50,20,.45); outline: 7px solid rgba(255,255,255,.45); }
.panel svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tag { position: absolute; left: 18px; top: 16px; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: calc(var(--h) * 0.026); }
.bad { background: #ff7a2e; color: #2a0f02; }
.good { background: #d9f6e6; color: #0f6b40; }
.nv { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: calc(var(--h) * 0.022); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; width: max-content; }
.nv i { width: 10px; height: 10px; border-radius: 50%; background: #76b900; }
</style></head>
<body style="--w: 1500px; --h: 1000px">
<div class="hero">
  <div class="brand"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#fff" fill-opacity=".14"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="translate(11 11) scale(1.75)"><path d="M3 8h10.5a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 17h7"/></g></svg>Wind Tunnel</div>
  <h1>Crash it here,<em>not on the floor.</em></h1>
  <div>
    <div class="stat">{{FROM}}% <span>to</span> {{TO}}%</div>
    <div class="sub">robot pass rate on scenarios it never trained on</div>
    <div class="nv" style="margin-top: 22px"><i></i>Nemotron on Nebius</div>
  </div>
</div>
<div class="right">
  <div class="panel">{{BEFORE}}<span class="tag bad">Policy v0: clipped the door</span></div>
  <div class="panel">{{AFTER}}<span class="tag good">After Nemotron: through clean</span></div>
</div>
</body></html>
